<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090b10">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles-light-full.css">
  <title>FitForge — Nutrition</title>

  <style>
    /* ── PANTRY PILLS ──────────────────────────────────────────── */
    .pantry-row {
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
    }

    .pantry-pill {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-full);
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      border: 1.5px solid;
      transition: all var(--transition-fast);
    }

    .pantry-pill--available {
      background: rgba(22,163,74,0.08);
      border-color: rgba(22,163,74,0.3);
      color: #15803d;
    }

    .pantry-pill--missing {
      background: var(--color-bg-elevated);
      border-color: var(--color-border);
      color: var(--color-text-muted);
    }

    .pantry-pill__dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .pantry-pill--available .pantry-pill__dot { background: var(--color-success); }
    .pantry-pill--missing   .pantry-pill__dot { background: var(--color-text-muted); }

    /* ── MEAL SLOT CARDS ───────────────────────────────────────── */
    .meal-plan-grid {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .meal-slot-card {
      background: var(--color-bg-surface);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      box-shadow: var(--shadow-sm);
    }

    .meal-slot-card.is-filled {
      border-color: var(--color-border-accent);
    }

    .meal-slot-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--space-3) var(--space-4);
      border-bottom: 1px solid var(--color-border);
      background: var(--color-bg-elevated);
    }

    .meal-slot-header__left {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .meal-slot-header__time {
      font-size: var(--text-xs);
      font-weight: var(--weight-bold);
      letter-spacing: var(--tracking-widest);
      text-transform: uppercase;
      color: var(--color-text-secondary);
    }

    .meal-slot-header__cal {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--color-text-muted);
    }

    .meal-slot-header__pct {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
    }

    /* Empty state — tap to choose */
    .meal-slot-empty {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-4) var(--space-5);
      cursor: pointer;
      transition: background var(--transition-fast);
    }

    .meal-slot-empty:hover { background: rgba(140,200,0,0.04); }

    .meal-slot-empty__text {
      font-size: var(--text-base);
      color: var(--color-text-muted);
    }

    .meal-slot-empty__badge {
      font-size: var(--text-xs);
      font-weight: var(--weight-bold);
      background: var(--color-accent);
      color: #0f1923;
      border-radius: var(--radius-full);
      padding: 2px 10px;
    }

    .meal-slot-empty__badge--zero {
      background: var(--color-bg-elevated);
      color: var(--color-text-muted);
    }

    /* Filled state — shows chosen recipe */
    .meal-slot-filled {
      padding: var(--space-4) var(--space-5);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-3);
      cursor: pointer;
    }

    .meal-slot-filled:hover { background: rgba(140,200,0,0.02); }

    .meal-slot-filled__info { flex: 1; min-width: 0; }

    .meal-slot-filled__name {
      font-size: var(--text-base);
      font-weight: var(--weight-bold);
      color: var(--color-text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meal-slot-filled__macros {
      display: flex;
      gap: var(--space-3);
      margin-top: var(--space-2);
    }

    .meal-macro-chip {
      display: flex;
      align-items: center;
      gap: 3px;
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--color-text-secondary);
    }

    .meal-macro-chip__dot {
      width: 6px; height: 6px;
      border-radius: 50%;
    }

    .meal-slot-filled__actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
      align-items: flex-end;
    }

    .meal-slot-filled__cal {
      font-family: var(--font-mono);
      font-size: var(--text-md);
      font-weight: var(--weight-bold);
      color: var(--color-text-primary);
    }

    .meal-slot-filled__swap {
      font-size: var(--text-xs);
      color: var(--color-accent-text);
      font-weight: var(--weight-medium);
      cursor: pointer;
    }

    /* ── MACRO SUMMARY ─────────────────────────────────────────── */
    .macro-summary-card {
      background: var(--color-bg-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      box-shadow: var(--shadow-sm);
    }

    .macro-summary-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: var(--space-5);
    }

    .macro-summary__title {
      font-size: var(--text-xs);
      font-weight: var(--weight-bold);
      letter-spacing: var(--tracking-widest);
      text-transform: uppercase;
      color: var(--color-text-secondary);
    }

    .macro-summary__cal {
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
    }

    .macro-summary__cal span {
      color: var(--color-text-primary);
      font-weight: var(--weight-bold);
    }

    .macro-summary-bars {
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
    }

    .macro-summary-row {
      display: grid;
      grid-template-columns: 60px 1fr auto;
      align-items: center;
      gap: var(--space-3);
    }

    .macro-summary-row__label {
      font-size: var(--text-sm);
      font-weight: var(--weight-medium);
      color: var(--color-text-secondary);
    }

    .macro-summary-row__values {
      font-family: var(--font-mono);
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      text-align: right;
      white-space: nowrap;
    }

    /* ── RECIPE PICKER MODAL ───────────────────────────────────── */
    .picker-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15,25,35,0.5);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 500;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-normal);
    }

    .picker-overlay.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .picker-sheet {
      width: 100%;
      max-width: var(--max-width-app);
      background: var(--color-bg-surface);
      border-top: 1px solid var(--color-border);
      border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      padding: var(--space-5);
      padding-bottom: calc(var(--space-8) + env(safe-area-inset-bottom, 0px));
      max-height: 82dvh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-4);
      transform: translateY(100%);
      transition: transform var(--transition-slow) cubic-bezier(0.4,0,0.2,1);
      box-shadow: 0 -8px 40px rgba(0,0,0,0.12);
    }

    .picker-overlay.is-open .picker-sheet {
      transform: translateY(0);
    }

    .picker-handle {
      width: 40px; height: 4px;
      background: var(--color-border);
      border-radius: var(--radius-full);
      margin: 0 auto;
    }

    .picker-header { display: flex; flex-direction: column; gap: var(--space-1); }
    .picker-header__slot { font-size: var(--text-xs); font-weight: var(--weight-bold); letter-spacing: var(--tracking-widest); text-transform: uppercase; color: var(--color-accent-text); }
    .picker-header__title { font-family: var(--font-display); font-size: var(--text-xl); color: var(--color-text-primary); }

    /* Picker filter tabs */
    .picker-tabs {
      display: flex;
      background: var(--color-bg-elevated);
      border-radius: var(--radius-full);
      padding: 3px;
      gap: 2px;
    }

    .picker-tab {
      flex: 1;
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-full);
      font-size: var(--text-xs);
      font-weight: var(--weight-bold);
      text-align: center;
      cursor: pointer;
      color: var(--color-text-muted);
      background: transparent;
      border: none;
      transition: all var(--transition-fast);
      font-family: var(--font-body);
      white-space: nowrap;
    }

    .picker-tab.is-active {
      background: var(--color-bg-surface);
      color: var(--color-text-primary);
      box-shadow: var(--shadow-sm);
    }

    /* Recipe cards inside the picker */
    .picker-recipe-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .picker-recipe-card {
      background: var(--color-bg-elevated);
      border: 1.5px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      gap: var(--space-4);
      align-items: center;
    }

    .picker-recipe-card:hover { border-color: var(--color-border-accent); background: rgba(140,200,0,0.04); }
    .picker-recipe-card.is-selected { border-color: var(--color-accent); background: rgba(140,200,0,0.07); }
    .picker-recipe-card.is-almost { opacity: 0.75; }
    .picker-recipe-card.is-locked { opacity: 0.4; pointer-events: none; }

    .picker-recipe-card__thumb {
      width: 52px; height: 52px;
      border-radius: var(--radius-md);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .picker-recipe-card__thumb--protein  { background: linear-gradient(135deg, #d4f0b0, #b8e090); }
    .picker-recipe-card__thumb--carbs    { background: linear-gradient(135deg, #b0d4f0, #90b8e8); }
    .picker-recipe-card__thumb--balanced { background: linear-gradient(135deg, #f0e0b0, #e8c880); }

    .picker-recipe-card__info { flex: 1; min-width: 0; }

    .picker-recipe-card__name {
      font-size: var(--text-base);
      font-weight: var(--weight-bold);
      color: var(--color-text-primary);
    }

    .picker-recipe-card__macros {
      display: flex;
      gap: var(--space-3);
      margin-top: var(--space-2);
    }

    .picker-recipe-card__missing {
      font-size: var(--text-xs);
      color: var(--color-warning);
      font-weight: var(--weight-medium);
      margin-top: var(--space-1);
    }

    .picker-recipe-card__cal {
      font-family: var(--font-mono);
      font-size: var(--text-md);
      font-weight: var(--weight-bold);
      color: var(--color-text-primary);
      text-align: right;
      flex-shrink: 0;
    }

    .picker-recipe-card__cal small {
      display: block;
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      font-weight: var(--weight-normal);
    }

    /* Available badge on card */
    .avail-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 9px;
      font-weight: var(--weight-bold);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: var(--radius-full);
    }

    .avail-badge--ready  { background: rgba(22,163,74,0.1); color: #15803d; }
    .avail-badge--almost { background: rgba(194,112,10,0.1); color: var(--color-warning); }

    /* Empty picker state */
    .picker-empty {
      text-align: center;
      padding: var(--space-10) var(--space-4);
      color: var(--color-text-muted);
    }
    .picker-empty__icon { font-size: 36px; margin-bottom: var(--space-3); }
    .picker-empty__text { font-size: var(--text-sm); line-height: var(--leading-relaxed); }
    .picker-empty__link { color: var(--color-accent-text); font-weight: var(--weight-bold); cursor: pointer; }

    /* ── ALMOST READY SECTION ──────────────────────────────────── */
    .almost-card {
      background: var(--color-bg-surface);
      border: 1px solid rgba(194,112,10,0.2);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      display: flex;
      align-items: center;
      gap: var(--space-4);
      box-shadow: var(--shadow-sm);
    }

    .almost-card__icon { font-size: 28px; flex-shrink: 0; }
    .almost-card__info { flex: 1; }
    .almost-card__name { font-size: var(--text-base); font-weight: var(--weight-bold); color: var(--color-text-primary); }
    .almost-card__missing { font-size: var(--text-xs); color: var(--color-warning); margin-top: 2px; font-weight: var(--weight-medium); }
    .almost-card__macros { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: 2px; font-family: var(--font-mono); }
    .almost-card__add { font-size: var(--text-xs); font-weight: var(--weight-bold); color: var(--color-accent-text); cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  </style>
</head>

<body>
  <div class="app-shell">

    <header class="app-header">
      <div class="app-header__logo">Fit<span>Forge</span></div>
      <div style="display:flex; gap:8px; align-items:center;">
        <div id="recipes-ready-badge" style="background:var(--color-accent); color:#0f1923; font-weight:700; font-size:var(--text-xs); padding:4px 12px; border-radius:var(--radius-full); display:none;">
          — ready
        </div>
        <a href="grocery-list.html" class="btn btn--secondary btn--sm" style="font-size:var(--text-xs);">🛒 Grocery</a>
      </div>
    </header>

    <main class="page-content" id="page-content">

      <!-- SECTION 1: Page title -->
      <section style="padding: var(--space-4) 0 var(--space-2);">
        <p class="label" style="color:var(--color-accent-text); margin-bottom:var(--space-2);">Today's Nutrition</p>
        <h1 class="heading-1" style="font-family:var(--font-display); letter-spacing:var(--tracking-tight);">Meal Plan</h1>
        <p style="font-size:var(--text-sm); color:var(--color-text-secondary); margin-top:var(--space-2);" id="pantry-subtitle">
          Loading your grocery list...
        </p>
      </section>

      <!-- SECTION 2: Your Pantry Today -->
      <section>
        <div class="section-header">
          <h2 class="section-header__title">Your Pantry</h2>
          <a href="grocery-list.html" class="section-header__link">Update list →</a>
        </div>
        <div class="pantry-row" id="pantry-pills">
          <!-- Injected by JS -->
          <div class="skeleton" style="height:32px; width:90px; border-radius:999px;"></div>
          <div class="skeleton" style="height:32px; width:80px; border-radius:999px;"></div>
          <div class="skeleton" style="height:32px; width:70px; border-radius:999px;"></div>
        </div>
      </section>

      <!-- SECTION 3: Meal Slots -->
      <section>
        <div class="section-header">
          <h2 class="section-header__title">Today's Meals</h2>
          <span class="section-header__link" id="meals-cal-total" style="font-family:var(--font-mono);">0 kcal planned</span>
        </div>

        <div class="meal-plan-grid" id="meal-plan-grid">
          <!-- Injected by JS -->
        </div>
      </section>

      <!-- SECTION 4: Daily Macro Summary -->
      <section>
        <div class="macro-summary-card animate-fade-in-up">
          <div class="macro-summary-header">
            <p class="macro-summary__title">Macro Summary</p>
            <div class="macro-summary__cal">
              <span id="summary-cal-planned">0</span> / <span id="summary-cal-target">—</span> kcal
            </div>
          </div>
          <div class="macro-summary-bars" id="macro-summary-bars">
            <!-- Injected by JS -->
          </div>
        </div>
      </section>

      <!-- SECTION 5: Almost Ready -->
      <section id="almost-section">
        <div class="section-header">
          <h2 class="section-header__title">Almost Ready</h2>
          <span style="font-size:var(--text-xs); color:var(--color-text-muted);">Missing 1 item</span>
        </div>
        <div class="stack stack-sm" id="almost-list">
          <!-- Injected by JS -->
        </div>
      </section>

      <div style="height: var(--space-8);"></div>
    </main>

    <!-- MEAL PICKER MODAL -->
    <div class="picker-overlay" id="picker-overlay" role="dialog" aria-modal="true" aria-label="Choose a meal">
      <div class="picker-sheet" id="picker-sheet">
        <div class="picker-handle" aria-hidden="true"></div>

        <div class="picker-header">
          <div class="picker-header__slot" id="picker-slot-label">Breakfast</div>
          <div class="picker-header__title">Choose a meal</div>
        </div>

        <!-- Filter tabs: Available / Almost Ready / All -->
        <div class="picker-tabs" role="tablist" id="picker-tabs">
          <button class="picker-tab is-active" data-filter="available" onclick="setPickerFilter('available')">✅ Available</button>
          <button class="picker-tab" data-filter="almost"    onclick="setPickerFilter('almost')">⚠ Almost</button>
          <button class="picker-tab" data-filter="all"       onclick="setPickerFilter('all')">All Recipes</button>
        </div>

        <div class="picker-recipe-list" id="picker-recipe-list">
          <!-- Injected by JS when modal opens -->
        </div>
      </div>
    </div>

    <div id="bottom-nav-container"></div>
  </div>

  <script src="script-merged.js"></script>

  <script>
    /**
     * ============================================================
     * NUTRITION PAGE SCRIPT
     * nutrition.html
     *
     * DATA FLOW:
     *   1. Read grocery list from localStorage (StorageHelpers or direct)
     *   2. Extract all checked items → their foodKeys
     *   3. For each recipe, check which required ingredients are checked
     *      available  = all required foodKeys are in checkedFoodKeys
     *      almost     = exactly 1 required foodKey is missing
     *      locked     = 2+ required foodKeys are missing
     *   4. Render 4 meal slots (Breakfast / Lunch / Dinner / Snack)
     *   5. Load saved meal plan from localStorage
     *   6. Picker modal opens on slot tap, filtered by availability
     *   7. Recipe selection updates slot + macro totals
     * ============================================================
     */

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       RECIPE CATALOG
       Each recipe has:
         slots[]             — which meal types it fits
         requiredIngredients — foodKeys that must be checked in grocery list
         thumbType           — visual style of the thumbnail
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    const RECIPE_CATALOG = [
      // ── BREAKFAST ──────────────────────────────────────────────
      {
        id: 'r-b1',
        name: 'Overnight Protein Oats',
        emoji: '🥣',
        slots: ['breakfast'],
        thumbType: 'carbs',
        calories: 380, proteinG: 28, carbsG: 48, fatG: 8,
        prepMin: 5,
        requiredIngredients: ['oats', 'greek_yogurt'],
        instructions: 'Combine oats, Greek yogurt, and protein powder. Refrigerate overnight. Top with blueberries.',
      },
      {
        id: 'r-b2',
        name: 'Egg White Scramble',
        emoji: '🍳',
        slots: ['breakfast'],
        thumbType: 'protein',
        calories: 280, proteinG: 32, carbsG: 12, fatG: 7,
        prepMin: 10,
        requiredIngredients: ['eggs', 'veggies'],
        instructions: 'Scramble egg whites with bell peppers and spinach. Season with salt and pepper.',
      },
      {
        id: 'r-b3',
        name: 'Greek Yogurt Power Bowl',
        emoji: '🫙',
        slots: ['breakfast', 'snack'],
        thumbType: 'protein',
        calories: 350, proteinG: 38, carbsG: 22, fatG: 10,
        prepMin: 5,
        requiredIngredients: ['greek_yogurt'],
        instructions: 'Layer Greek yogurt with berries, walnuts, and a drizzle of honey.',
      },
      {
        id: 'r-b4',
        name: 'PB Banana Oats',
        emoji: '🥜',
        slots: ['breakfast'],
        thumbType: 'carbs',
        calories: 420, proteinG: 14, carbsG: 58, fatG: 14,
        prepMin: 5,
        requiredIngredients: ['oats'],
        instructions: 'Cook oats, stir in peanut butter and sliced banana. Top with chia seeds.',
      },

      // ── LUNCH ──────────────────────────────────────────────────
      {
        id: 'r-l1',
        name: 'Grilled Chicken Bowl',
        emoji: '🍗',
        slots: ['lunch', 'dinner'],
        thumbType: 'protein',
        calories: 520, proteinG: 45, carbsG: 52, fatG: 9,
        prepMin: 25,
        requiredIngredients: ['chicken', 'rice', 'veggies'],
        instructions: 'Grill chicken breast, serve over brown rice with roasted broccoli. Drizzle with olive oil.',
      },
      {
        id: 'r-l2',
        name: 'Turkey Taco Bowl',
        emoji: '🦃',
        slots: ['lunch', 'dinner'],
        thumbType: 'balanced',
        calories: 540, proteinG: 48, carbsG: 55, fatG: 12,
        prepMin: 20,
        requiredIngredients: ['turkey', 'rice'],
        instructions: 'Cook ground turkey with taco seasoning. Serve over rice with salsa and avocado.',
      },

    /* ── MEAL SLOT DEFINITIONS ───────────────────────────────────
       Each slot: id, display name, time label, calorie % of target,
       which recipe slots are compatible
    ─────────────────────────────────────────────────────────── */
    const MEAL_SLOTS = [
      { id: 'breakfast', label: 'Breakfast', time: '7–9 AM',   pct: 0.25, compatibleSlots: ['breakfast'] },
      { id: 'lunch',     label: 'Lunch',     time: '12–1 PM',  pct: 0.35, compatibleSlots: ['lunch'] },
      { id: 'dinner',    label: 'Dinner',    time: '6–7 PM',   pct: 0.30, compatibleSlots: ['dinner', 'lunch'] },
      { id: 'snack',     label: 'Snack',     time: 'Anytime',  pct: 0.10, compatibleSlots: ['snack'] },
    ];

    const STORAGE_MEAL_PLAN_KEY = 'fitforge_meal_plan';

    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       PAGE STATE
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    const nutritionState = {
      profile:          null,
      checkedFoodKeys:  [],   // foodKeys of checked grocery items
      checkedCategories:[],   // which categories have any checked items
      mealPlan: {             // chosen recipe per slot (null = empty)
        breakfast: null,
        lunch:     null,
        dinner:    null,
        snack:     null,
      },
      // Active picker state
      activeSlotId:  null,
      pickerFilter:  'available',
    };


    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       INITIALIZATION
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    document.addEventListener('DOMContentLoaded', () => {
      nutritionState.profile = AppState.getProfile();

      // 1. Load grocery list and extract checked foodKeys
      loadGroceryData();

      // 2. Load saved meal plan for today
      loadSavedMealPlan();

      // 3. Render all sections
      renderPantry();
      renderMealSlots();
      renderMacroSummary();
      renderAlmostReady();
      renderHeaderBadge();

      // 4. Wire up modal close on overlay tap
      document.getElementById('picker-overlay')?.addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closePicker();
      });
    });


    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       DATA: GROCERY LIST → CHECKED FOOD KEYS
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    function loadGroceryData() {
      try {
        const stored = localStorage.getItem('fitforge_grocery_list');
        if (!stored) {
          UIHelpers.setText('#pantry-subtitle', 'No grocery list found — add items to unlock recipes.');
          return;
        }

        const data  = JSON.parse(stored);
        const items = data?.items ?? [];

        // Extract foodKeys from CHECKED items only
        const checkedItems = items.filter(i => i.checked && i.foodKey);
        nutritionState.checkedFoodKeys = [...new Set(checkedItems.map(i => i.foodKey))];

        // Which categories have any checked items
        const checkedCats = [...new Set(items.filter(i => i.checked).map(i => i.category))];
        nutritionState.checkedCategories = checkedCats;

        // Subtitle
        const totalChecked = items.filter(i => i.checked).length;
        const totalItems   = items.length;
        UIHelpers.setText('#pantry-subtitle',
          totalChecked > 0
            ? `${totalChecked} of ${totalItems} grocery items checked`
            : 'Check items on your grocery list to unlock recipes.'
        );

      } catch (e) {
        console.error('Failed to load grocery data:', e);
        UIHelpers.setText('#pantry-subtitle', 'Could not load grocery list.');
      }
    }


    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       RECIPE AVAILABILITY LOGIC
       Core function: checks a recipe against checkedFoodKeys.
       Returns: 'available' | 'almost' | 'locked'
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    function getRecipeAvailability(recipe) {
      const required = recipe.requiredIngredients ?? [];

      // Recipes with no required ingredients are always available
      if (required.length === 0) return { status: 'available', missing: [] };

      const missing = required.filter(key => !nutritionState.checkedFoodKeys.includes(key));

      if (missing.length === 0) return { status: 'available', missing: [] };
      if (missing.length === 1) return { status: 'almost',    missing };
      return                            { status: 'locked',    missing };
    }

    /** Get ingredient display name from foodKey */
    function foodKeyToName(key) {
      const map = {
        chicken: 'Chicken', rice: 'Rice', veggies: 'Vegetables',
        turkey: 'Turkey', salmon: 'Salmon', tuna: 'Tuna',
        shrimp: 'Shrimp', beef: 'Beef', tofu: 'Tofu',
        eggs: 'Eggs', greek_yogurt: 'Greek Yogurt',
        cottage_cheese: 'Cottage Cheese', oats: 'Oats',
        potato: 'Sweet Potato', avocado: 'Avocado',
        pasta: 'Pasta', bread: 'Bread', quinoa: 'Quinoa',
      };
      return map[key] ?? key;
    }

    /** Count available recipes for a given slot */
    function countAvailableForSlot(slotId) {
      const slot = MEAL_SLOTS.find(s => s.id === slotId);
      if (!slot) return 0;
      return RECIPE_CATALOG.filter(r =>
        slot.compatibleSlots.some(cs => r.slots.includes(cs)) &&
        getRecipeAvailability(r).status === 'available'
      ).length;
    }

    /** Total count of available recipes across all slots */
    function countTotalAvailable() {
      return RECIPE_CATALOG.filter(r => getRecipeAvailability(r).status === 'available').length;
    }


    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       MEAL PLAN PERSISTENCE
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    function loadSavedMealPlan() {
      try {
        const raw = localStorage.getItem(STORAGE_MEAL_PLAN_KEY);
        if (!raw) return;
        const saved = JSON.parse(raw);

        // Only load if saved for today (meal plan resets each day)
        const today = UIHelpers.getTodayString();
        if (saved.date !== today) return;

        MEAL_SLOTS.forEach(slot => {
          if (saved[slot.id]) {
            // Find recipe by id to ensure it's still valid
            const recipe = RECIPE_CATALOG.find(r => r.id === saved[slot.id]);
            if (recipe) nutritionState.mealPlan[slot.id] = recipe;
          }
        });
      } catch (e) {
        console.error('Failed to load meal plan:', e);
      }
    }

    function saveMealPlan() {
      const toSave = { date: UIHelpers.getTodayString() };
      MEAL_SLOTS.forEach(slot => {
        toSave[slot.id] = nutritionState.mealPlan[slot.id]?.id ?? null;
      });
      localStorage.setItem(STORAGE_MEAL_PLAN_KEY, JSON.stringify(toSave));
    }


    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       RENDER: HEADER BADGE — "X recipes ready"
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    function renderHeaderBadge() {
      const badge = document.getElementById('recipes-ready-badge');
      if (!badge) return;
      const count = countTotalAvailable();
      if (count > 0) {
        badge.textContent = `${count} ready`;
        badge.style.display = 'block';
      } else {
        badge.style.display = 'none';
      }
    }


    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       RENDER: PANTRY PILLS
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    function renderPantry() {
      const container = document.getElementById('pantry-pills');
      if (!container) return;

      const categories = [
        { key: 'protein', label: 'Proteins', icon: '🍗' },
        { key: 'carbs',   label: 'Carbs',    icon: '🌾' },
        { key: 'fat',     label: 'Fats',      icon: '🥑' },
        { key: 'produce', label: 'Produce',   icon: '🥦' },
      ];

      container.innerHTML = categories.map(cat => {
        const available = nutritionState.checkedCategories.includes(cat.key);
        return `
          <div class="pantry-pill pantry-pill--${available ? 'available' : 'missing'}">
            <div class="pantry-pill__dot"></div>
            <span>${cat.icon} ${cat.label}</span>
          </div>
        `;
      }).join('');
    }


    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       RENDER: MEAL SLOTS
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    function renderMealSlots() {
      const grid = document.getElementById('meal-plan-grid');
      if (!grid) return;

      const profile       = nutritionState.profile;
      const targetCal     = profile?.calculatedMacros?.targetCalories ?? 2000;

      grid.innerHTML = MEAL_SLOTS.map(slot => {
        const recipe     = nutritionState.mealPlan[slot.id];
        const slotTarget = Math.round(targetCal * slot.pct);
        const available  = countAvailableForSlot(slot.id);

        return `
          <div class="meal-slot-card ${recipe ? 'is-filled' : ''}" id="slot-card-${slot.id}">

            <!-- Slot header row -->
            <div class="meal-slot-header">
              <div class="meal-slot-header__left">
                <span class="meal-slot-header__time">${slot.label}</span>
                <span class="meal-slot-header__pct" style="color:var(--color-text-muted);">· ${slot.time}</span>
              </div>
              <span class="meal-slot-header__cal">~${slotTarget} kcal target</span>
            </div>

            <!-- Slot body: empty or filled -->
            ${recipe
              ? buildFilledSlot(slot, recipe)
              : buildEmptySlot(slot, available)
            }
          </div>
        `;
      }).join('');

      updateCalTotals();
    }

    function buildEmptySlot(slot, availableCount) {
      return `
        <div class="meal-slot-empty" onclick="openPicker('${slot.id}')"
             role="button" tabindex="0" aria-label="Choose ${slot.label}">
          <span class="meal-slot-empty__text">Tap to choose a ${slot.label.toLowerCase()}</span>
          <span class="meal-slot-empty__badge ${availableCount === 0 ? 'meal-slot-empty__badge--zero' : ''}">
            ${availableCount > 0 ? `${availableCount} available` : 'Check grocery list'}
          </span>
        </div>
      `;
    }

    function buildFilledSlot(slot, recipe) {
      return `
        <div class="meal-slot-filled" onclick="openPicker('${slot.id}')"
             role="button" tabindex="0" aria-label="Change ${slot.label}: currently ${recipe.name}">
          <div class="meal-slot-filled__info">
            <div class="meal-slot-filled__name">${UIHelpers.escapeHTML(recipe.emoji)} ${UIHelpers.escapeHTML(recipe.name)}</div>
            <div class="meal-slot-filled__macros">
              <span class="meal-macro-chip">
                <span class="meal-macro-chip__dot" style="background:var(--color-protein);"></span>
                ${recipe.proteinG}g P
              </span>
              <span class="meal-macro-chip">
                <span class="meal-macro-chip__dot" style="background:var(--color-carbs);"></span>
                ${recipe.carbsG}g C
              </span>
              <span class="meal-macro-chip">
                <span class="meal-macro-chip__dot" style="background:var(--color-fat);"></span>
                ${recipe.fatG}g F
              </span>
            </div>
          </div>
          <div class="meal-slot-filled__actions">
            <div class="meal-slot-filled__cal">${recipe.calories}</div>
            <div class="meal-slot-filled__swap">Swap ⇄</div>
          </div>
        </div>
      `;
    }


    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       RENDER: MACRO SUMMARY
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    function renderMacroSummary() {
      const profile   = nutritionState.profile;
      const macros    = profile?.calculatedMacros;
      const container = document.getElementById('macro-summary-bars');
      if (!container) return;

      const targets = {
        proteinG: macros?.proteinG ?? 180,
        carbsG:   macros?.carbsG   ?? 200,
        fatG:     macros?.fatG     ?? 55,
        calories: macros?.targetCalories ?? 2000,
      };

      // Sum macros from chosen meals
      const planned = getTotalPlannedMacros();

      UIHelpers.setText('#summary-cal-planned', planned.calories);
      UIHelpers.setText('#summary-cal-target',  targets.calories);

      const rows = [
        { label: 'Protein', planned: planned.proteinG, target: targets.proteinG, color: 'var(--color-protein)' },
        { label: 'Carbs',   planned: planned.carbsG,   target: targets.carbsG,   color: 'var(--color-carbs)' },
        { label: 'Fat',     planned: planned.fatG,      target: targets.fatG,     color: 'var(--color-fat)' },
      ];

      container.innerHTML = rows.map(row => {
        const pct = Math.min(100, Math.round((row.planned / row.target) * 100));
        return `
          <div class="macro-summary-row">
            <span class="macro-summary-row__label">${row.label}</span>
            <div style="flex:1;">
              <div class="progress-bar">
                <div class="progress-bar__fill" style="background:${row.color}; width:${pct}%;"></div>
              </div>
            </div>
            <span class="macro-summary-row__values">${row.planned}g / ${row.target}g</span>
          </div>
        `;
      }).join('');
    }


    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       RENDER: ALMOST READY SECTION
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    function renderAlmostReady() {
      const section = document.getElementById('almost-section');
      const list    = document.getElementById('almost-list');
      if (!list) return;

      const almostRecipes = RECIPE_CATALOG.filter(r => {
        const { status } = getRecipeAvailability(r);
        return status === 'almost';
      });

      if (almostRecipes.length === 0) {
        section?.style && (section.style.display = 'none');
        return;
      }

      list.innerHTML = almostRecipes.slice(0, 4).map(recipe => {
        const { missing } = getRecipeAvailability(recipe);
        const missingName = missing.map(foodKeyToName).join(', ');
        return `
          <div class="almost-card">
            <div class="almost-card__icon">${UIHelpers.escapeHTML(recipe.emoji)}</div>
            <div class="almost-card__info">
              <div class="almost-card__name">${UIHelpers.escapeHTML(recipe.name)}</div>
              <div class="almost-card__missing">Missing: ${UIHelpers.escapeHTML(missingName)}</div>
              <div class="almost-card__macros">${recipe.calories} kcal · ${recipe.proteinG}P · ${recipe.carbsG}C · ${recipe.fatG}F</div>
            </div>
            <a href="grocery-list.html" class="almost-card__add">+ Add →</a>
          </div>
        `;
      }).join('');
    }


    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       TOTALS HELPERS
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    function getTotalPlannedMacros() {
      const totals = { calories: 0, proteinG: 0, carbsG: 0, fatG: 0 };
      MEAL_SLOTS.forEach(slot => {
        const r = nutritionState.mealPlan[slot.id];
        if (r) {
          totals.calories += r.calories;
          totals.proteinG += r.proteinG;
          totals.carbsG   += r.carbsG;
          totals.fatG     += r.fatG;
        }
      });
      return totals;
    }

    function updateCalTotals() {
      const totals = getTotalPlannedMacros();
      UIHelpers.setText('#meals-cal-total', `${totals.calories.toLocaleString()} kcal planned`);
    }


    /* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
       MEAL PICKER MODAL
    ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
    function openPicker(slotId) {
      nutritionState.activeSlotId = slotId;
      nutritionState.pickerFilter = 'available';

      const slot = MEAL_SLOTS.find(s => s.id === slotId);

      UIHelpers.setText('#picker-slot-label', slot?.label ?? slotId);

      // Reset tab active state
      setPickerFilter('available');

      // Show the modal
      document.getElementById('picker-overlay').classList.add('is-open');
    }

    function closePicker() {
      document.getElementById('picker-overlay').classList.remove('is-open');
      nutritionState.activeSlotId = null;
    }

    function setPickerFilter(filter) {
      nutritionState.pickerFilter = filter;

      // Update tab styles
      document.querySelectorAll('.picker-tab').forEach(btn => {
        btn.classList.toggle('is-active', btn.dataset.filter === filter);
      });

      renderPickerRecipes();
    }

    function renderPickerRecipes() {
      const list    = document.getElementById('picker-recipe-list');
      const slotId  = nutritionState.activeSlotId;
      const filter  = nutritionState.pickerFilter;
      if (!list || !slotId) return;

      const slot = MEAL_SLOTS.find(s => s.id === slotId);
      if (!slot) return;

      // Get recipes compatible with this slot
      let recipes = RECIPE_CATALOG.filter(r =>
        slot.compatibleSlots.some(cs => r.slots.includes(cs))
      );

      // Apply availability filter
      recipes = recipes.filter(r => {
        const { status } = getRecipeAvailability(r);
        if (filter === 'available') return status === 'available';
        if (filter === 'almost')    return status === 'almost';
        return true; // 'all'
      });

      if (recipes.length === 0) {
        list.innerHTML = `
          <div class="picker-empty">
            <div class="picker-empty__icon">${filter === 'available' ? '🛒' : '📋'}</div>
            <div class="picker-empty__text">
              ${filter === 'available'
                ? `No recipes available yet for ${slot.label}.<br>
                   <span class="picker-empty__link" onclick="window.location.href='grocery-list.html'">
                     Check items on your grocery list →
                   </span>`
                : `No ${filter === 'almost' ? '"almost ready"' : ''} recipes for ${slot.label}.`}
            </div>
          </div>
        `;
        return;
      }

      const currentRecipe = nutritionState.mealPlan[slotId];

      list.innerHTML = recipes.map(recipe => {
        const { status, missing } = getRecipeAvailability(recipe);
        const isSelected = currentRecipe?.id === recipe.id;

        return `
          <div class="picker-recipe-card ${isSelected ? 'is-selected' : ''} ${status === 'almost' ? 'is-almost' : ''}"
               onclick="selectRecipe('${recipe.id}')"
               role="button"
               tabindex="0"
               aria-label="Select ${recipe.name}, ${recipe.calories} calories"
               aria-pressed="${isSelected}">

            <!-- Thumb -->
            <div class="picker-recipe-card__thumb picker-recipe-card__thumb--${recipe.thumbType}">
              ${UIHelpers.escapeHTML(recipe.emoji)}
            </div>

            <!-- Info -->
            <div class="picker-recipe-card__info">
              <div style="display:flex; align-items:center; gap:6px; margin-bottom:4px;">
                <span class="picker-recipe-card__name">${UIHelpers.escapeHTML(recipe.name)}</span>
                ${status === 'available'
                  ? `<span class="avail-badge avail-badge--ready">✓ Ready</span>`
                  : status === 'almost'
                  ? `<span class="avail-badge avail-badge--almost">⚠ Almost</span>`
                  : ''}
              </div>
              <div class="picker-recipe-card__macros">
                <span class="meal-macro-chip">
                  <span class="meal-macro-chip__dot" style="background:var(--color-protein);"></span>${recipe.proteinG}g P
                </span>
                <span class="meal-macro-chip">
                  <span class="meal-macro-chip__dot" style="background:var(--color-carbs);"></span>${recipe.carbsG}g C
                </span>
                <span class="meal-macro-chip">
                  <span class="meal-macro-chip__dot" style="background:var(--color-fat);"></span>${recipe.fatG}g F
                </span>
              </div>
              ${missing.length > 0
                ? `<div class="picker-recipe-card__missing">
                     Missing: ${missing.map(foodKeyToName).map(n => UIHelpers.escapeHTML(n)).join(', ')}
                   </div>`
                : ''}
              <div style="font-size:var(--text-xs); color:var(--color-text-muted); margin-top:3px;">
                ⏱ ${recipe.prepMin} min
              </div>
            </div>

            <!-- Cal -->
            <div class="picker-recipe-card__cal">
              ${recipe.calories}
              <small>kcal</small>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectRecipe(recipeId) {
      const slotId = nutritionState.activeSlotId;
      if (!slotId) return;

      const recipe = RECIPE_CATALOG.find(r => r.id === recipeId);
      if (!recipe) return;

      // Set in state
      nutritionState.mealPlan[slotId] = recipe;

      // Save to localStorage
      saveMealPlan();

      // Close picker
      closePicker();

      // Re-render updated sections
      renderMealSlots();
      renderMacroSummary();
      renderAlmostReady();

      UIHelpers.showToast(`${recipe.name} added to ${MEAL_SLOTS.find(s => s.id === slotId)?.label}`, 'success');
    }
  </script>
</body>
</html>
