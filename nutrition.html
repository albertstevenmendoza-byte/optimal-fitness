<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
 <meta name="theme-color" content="#090b10">
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
 <link rel="stylesheet" href="styles-light-full.css">
 <title>FitForge — Nutrition</title>

 <style>
 /* ── PANTRY PILLS ──────────────────────────────────────── */
 .pantry-row { display:flex; gap:var(--space-2); flex-wrap:wrap; }
 .pantry-pill { display:flex; align-items:center; gap:var(--space-2); padding:var(--space-2) var(--space-4); border-radius:var(--radius-full); font-size:var(--text-sm); font-weight:var(--weight-medium); border:1.5px solid; transition:all var(--transition-fast); }
 .pantry-pill--available { background:rgba(22,163,74,0.08); border-color:rgba(22,163,74,0.3); color:#15803d; }
 .pantry-pill--missing { background:var(--color-bg-elevated); border-color:var(--color-border); color:var(--color-text-muted); }
 .pantry-pill__dot { width:7px; height:7px; border-radius:50%; flex-shrink:0; }
 .pantry-pill--available .pantry-pill__dot { background:var(--color-success); }
 .pantry-pill--missing .pantry-pill__dot { background:var(--color-text-muted); }

 /* ── MEAL SLOT CARDS ───────────────────────────────────── */
 .meal-plan-grid { display:flex; flex-direction:column; gap:var(--space-3); }
 .meal-slot-card { background:var(--color-bg-surface); border:1.5px solid var(--color-border); border-radius:var(--radius-lg); overflow:hidden; transition:border-color var(--transition-fast); box-shadow:var(--shadow-sm); }
 .meal-slot-card.is-filled { border-color:var(--color-border-accent); }
 .meal-slot-header { display:flex; justify-content:space-between; align-items:center; padding:var(--space-3) var(--space-4); border-bottom:1px solid var(--color-border); background:var(--color-bg-elevated); }
 .meal-slot-header__left { display:flex; align-items:center; gap:var(--space-2); }
 .meal-slot-header__time { font-size:var(--text-xs); font-weight:var(--weight-bold); letter-spacing:var(--tracking-widest); text-transform:uppercase; color:var(--color-text-secondary); }
 .meal-slot-header__cal { font-family:var(--font-mono); font-size:var(--text-xs); color:var(--color-text-muted); }
 .meal-slot-empty { display:flex; align-items:center; justify-content:space-between; padding:var(--space-4) var(--space-5); cursor:pointer; transition:background var(--transition-fast); }
 .meal-slot-empty:hover { background:rgba(0,34,68,0.04); }
 .meal-slot-empty__text { font-size:var(--text-base); color:var(--color-text-muted); }
 .meal-slot-empty__badge { font-size:var(--text-xs); font-weight:var(--weight-bold); background:var(--color-accent); color:#ffffff; border-radius:var(--radius-full); padding:2px 10px; }
 .meal-slot-empty__badge--zero { background:var(--color-bg-elevated); color:var(--color-text-muted); }
 .meal-slot-filled { padding:var(--space-4) var(--space-5); display:flex; justify-content:space-between; align-items:center; gap:var(--space-3); }
 .meal-slot-filled__info { flex:1; min-width:0; }
 .meal-slot-filled__name { font-size:var(--text-base); font-weight:var(--weight-bold); color:var(--color-text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
 .meal-slot-filled__macros { display:flex; gap:var(--space-3); margin-top:var(--space-2); }
 .meal-macro-chip { display:flex; align-items:center; gap:3px; font-family:var(--font-mono); font-size:var(--text-xs); color:var(--color-text-secondary); }
 .meal-macro-chip__dot { width:6px; height:6px; border-radius:50%; }
 .meal-slot-filled__actions { display:flex; flex-direction:column; gap:var(--space-2); align-items:flex-end; }
 .meal-slot-filled__cal { font-family:var(--font-mono); font-size:var(--text-md); font-weight:var(--weight-bold); color:var(--color-text-primary); }
 .meal-slot-filled__swap { font-size:var(--text-xs); color:var(--color-accent-text); font-weight:var(--weight-medium); cursor:pointer; }

 /* ── MACRO SUMMARY ─────────────────────────────────────── */
 .macro-summary-card { background:var(--color-bg-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); padding:var(--space-6); box-shadow:var(--shadow-sm); }
 .macro-summary-header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:var(--space-5); }
 .macro-summary__title { font-size:var(--text-xs); font-weight:var(--weight-bold); letter-spacing:var(--tracking-widest); text-transform:uppercase; color:var(--color-text-secondary); }
 .macro-summary__cal { font-family:var(--font-mono); font-size:var(--text-sm); color:var(--color-text-secondary); }
 .macro-summary-bars { display:flex; flex-direction:column; gap:var(--space-4); }
 .macro-summary-row { display:grid; grid-template-columns:60px 1fr auto; align-items:center; gap:var(--space-3); }
 .macro-summary-row__label { font-size:var(--text-sm); font-weight:var(--weight-medium); color:var(--color-text-secondary); }
 .macro-summary-row__values { font-family:var(--font-mono); font-size:var(--text-xs); color:var(--color-text-muted); text-align:right; white-space:nowrap; }

 /* ── ALMOST READY ──────────────────────────────────────── */
 .almost-card { background:var(--color-bg-surface); border:1px solid rgba(194,112,10,0.2); border-radius:var(--radius-lg); padding:var(--space-4); display:flex; align-items:center; gap:var(--space-4); box-shadow:var(--shadow-sm); }
 .almost-card__icon { font-size:28px; flex-shrink:0; }
 .almost-card__info { flex:1; }
 .almost-card__name { font-size:var(--text-base); font-weight:var(--weight-bold); color:var(--color-text-primary); }
 .almost-card__missing { font-size:var(--text-xs); color:var(--color-warning); margin-top:2px; font-weight:var(--weight-medium); }
 .almost-card__macros { font-size:var(--text-xs); color:var(--color-text-muted); margin-top:2px; font-family:var(--font-mono); }
 .almost-card__add { font-size:var(--text-xs); font-weight:var(--weight-bold); color:var(--color-accent-text); cursor:pointer; white-space:nowrap; flex-shrink:0; }

 /* ── SHARED OVERLAY + SHEET ────────────────────────────── */
 .sheet-overlay { position:fixed; inset:0; background:rgba(15,25,35,0.5); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); z-index:500; display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity var(--transition-normal); }
 .sheet-overlay.is-open { opacity:1; pointer-events:auto; }
 .sheet { width:100%; max-width:var(--max-width-app); background:var(--color-bg-surface); border-top:1px solid var(--color-border); border-radius:var(--radius-xl) var(--radius-xl) 0 0; padding:var(--space-5); padding-bottom:calc(var(--space-8) + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:var(--space-4); transform:translateY(100%); transition:transform var(--transition-slow) cubic-bezier(0.4,0,0.2,1); box-shadow:0 -8px 40px rgba(0,0,0,0.12); }
 .sheet-overlay.is-open .sheet { transform:translateY(0); }
 .sheet--tall { max-height:90dvh; overflow-y:auto; }
 .sheet-handle { width:40px; height:4px; background:var(--color-border); border-radius:var(--radius-full); margin:0 auto; flex-shrink:0; }

 /* ── PICKER SHEET ──────────────────────────────────────── */
 .picker-tabs { display:flex; background:var(--color-bg-elevated); border-radius:var(--radius-full); padding:3px; gap:2px; }
 .picker-tab { flex:1; padding:var(--space-2) var(--space-3); border-radius:var(--radius-full); font-size:var(--text-xs); font-weight:var(--weight-bold); text-align:center; cursor:pointer; color:var(--color-text-muted); background:transparent; border:none; transition:all var(--transition-fast); font-family:var(--font-body); white-space:nowrap; }
 .picker-tab.is-active { background:var(--color-bg-surface); color:var(--color-text-primary); box-shadow:var(--shadow-sm); }
 .picker-recipe-list { display:flex; flex-direction:column; gap:var(--space-3); }

 /* Recipe card in picker */
 .picker-recipe-card { background:var(--color-bg-elevated); border:1.5px solid var(--color-border); border-radius:var(--radius-lg); padding:var(--space-4); transition:all var(--transition-fast); display:flex; gap:var(--space-3); align-items:center; }
 .picker-recipe-card.is-selected { border-color:var(--color-accent); background:rgba(0,34,68,0.07); }
 .picker-recipe-card.is-almost { opacity:0.8; }
 .picker-recipe-card__thumb { width:50px; height:50px; border-radius:var(--radius-md); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:22px; }
 .picker-recipe-card__thumb--protein { background:linear-gradient(135deg,#d4f0b0,#b8e090); }
 .picker-recipe-card__thumb--carbs { background:linear-gradient(135deg,#b0d4f0,#90b8e8); }
 .picker-recipe-card__thumb--balanced { background:linear-gradient(135deg,#f0e0b0,#e8c880); }
 .picker-recipe-card__body { flex:1; min-width:0; }
 .picker-recipe-card__name { font-size:var(--text-base); font-weight:var(--weight-bold); color:var(--color-text-primary); }
 .picker-recipe-card__macros { display:flex; gap:var(--space-3); margin-top:var(--space-2); flex-wrap:wrap; }
 .picker-recipe-card__missing { font-size:var(--text-xs); color:var(--color-warning); font-weight:var(--weight-medium); margin-top:var(--space-1); }
 .picker-recipe-card__right { display:flex; flex-direction:column; align-items:flex-end; gap:var(--space-2); flex-shrink:0; }
 .picker-recipe-card__cal { font-family:var(--font-mono); font-size:var(--text-md); font-weight:var(--weight-bold); color:var(--color-text-primary); }
 .picker-recipe-card__cal small { display:block; font-size:9px; color:var(--color-text-muted); font-weight:var(--weight-normal); text-align:right; }

 /* Info button on each card */
 .info-btn { width:30px; height:30px; border-radius:50%; border:1.5px solid var(--color-border); background:var(--color-bg-surface); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px; color:var(--color-text-secondary); transition:all var(--transition-fast); flex-shrink:0; }
 .info-btn:hover { border-color:var(--color-border-accent); color:var(--color-accent-text); background:var(--color-accent-subtle); }

 /* Availability badges */
 .avail-badge { display:inline-flex; align-items:center; gap:3px; font-size:9px; font-weight:var(--weight-bold); letter-spacing:0.06em; text-transform:uppercase; padding:2px 7px; border-radius:var(--radius-full); }
 .avail-badge--ready { background:rgba(22,163,74,0.1); color:#15803d; }
 .avail-badge--almost { background:rgba(194,112,10,0.1); color:var(--color-warning); }

 .picker-empty { text-align:center; padding:var(--space-10) var(--space-4); color:var(--color-text-muted); }
 .picker-empty__icon { font-size:36px; margin-bottom:var(--space-3); }
 .picker-empty__text { font-size:var(--text-sm); line-height:var(--leading-relaxed); }
 .picker-empty__link { color:var(--color-accent-text); font-weight:var(--weight-bold); cursor:pointer; }

 /* ── RECIPE DETAIL SHEET ───────────────────────────────── */
 .detail-hero { display:flex; align-items:center; gap:var(--space-4); }
 .detail-hero__thumb { width:72px; height:72px; border-radius:var(--radius-lg); display:flex; align-items:center; justify-content:center; font-size:36px; flex-shrink:0; }
 .detail-hero__info { flex:1; }
 .detail-hero__name { font-family:var(--font-display); font-size:var(--text-xl); color:var(--color-text-primary); line-height:var(--leading-tight); letter-spacing:var(--tracking-tight); }
 .detail-hero__meta { font-size:var(--text-xs); color:var(--color-text-muted); margin-top:var(--space-1); display:flex; gap:var(--space-3); }

 /* Macro pills row in detail */
 .detail-macro-row { display:flex; gap:var(--space-2); flex-wrap:wrap; }
 .detail-macro-pill { flex:1; min-width:70px; background:var(--color-bg-elevated); border:1px solid var(--color-border); border-radius:var(--radius-md); padding:var(--space-3) var(--space-4); display:flex; flex-direction:column; align-items:center; gap:2px; }
 .detail-macro-pill__value { font-family:var(--font-mono); font-size:var(--text-lg); font-weight:var(--weight-bold); color:var(--color-text-primary); line-height:1; }
 .detail-macro-pill__label { font-size:9px; text-transform:uppercase; letter-spacing:0.06em; color:var(--color-text-muted); }

 /* Ingredients list */
 .detail-section-label { font-size:var(--text-xs); font-weight:var(--weight-bold); letter-spacing:var(--tracking-widest); text-transform:uppercase; color:var(--color-text-secondary); margin-bottom:var(--space-3); }
 .ingredient-list { display:flex; flex-direction:column; gap:var(--space-2); }
 .ingredient-row { display:flex; align-items:center; justify-content:space-between; padding:var(--space-3) var(--space-4); background:var(--color-bg-elevated); border-radius:var(--radius-md); }
 .ingredient-row__name { font-size:var(--text-sm); color:var(--color-text-primary); font-weight:var(--weight-medium); }
 .ingredient-row__amount { font-family:var(--font-mono); font-size:var(--text-sm); color:var(--color-text-secondary); }
 .ingredient-row__status { font-size:12px; flex-shrink:0; margin-left:var(--space-2); }

 /* Instructions list */
 .instructions-list { display:flex; flex-direction:column; gap:var(--space-3); }
 .instruction-step { display:flex; gap:var(--space-3); align-items:flex-start; }
 .instruction-step__num { width:24px; height:24px; border-radius:50%; background:var(--color-accent); color:#ffffff; font-size:11px; font-weight:var(--weight-bold); display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }
 .instruction-step__text { font-size:var(--text-sm); color:var(--color-text-primary); line-height:var(--leading-relaxed); }

 /* Select CTA in detail view */
 .detail-cta { position:sticky; bottom:0; background:var(--color-bg-surface); padding-top:var(--space-4); border-top:1px solid var(--color-border); margin-top:var(--space-2); }
 </style>
</head>

<body>
 <div class="app-shell">

 <header class="app-header">
 <div class="app-header__logo">Fit<span>Forge</span></div>
 <div style="display:flex; gap:8px; align-items:center;">
 <div id="recipes-ready-badge" style="display:none; background:var(--color-accent); color:#ffffff; font-weight:700; font-size:var(--text-xs); padding:4px 12px; border-radius:var(--radius-full);">— ready</div>
 <a href="grocery-list.html" class="btn btn--secondary btn--sm" style="font-size:var(--text-xs);">Grocery</a>
 </div>
 </header>

 <main class="page-content" id="page-content">

 <section style="padding:var(--space-4) 0 var(--space-2);">
 <p class="label" style="color:var(--color-accent-text); margin-bottom:var(--space-2);">Today's Nutrition</p>
 <h1 class="heading-1" style="font-family:var(--font-display); letter-spacing:var(--tracking-tight);">Meal Plan</h1>
 <p style="font-size:var(--text-sm); color:var(--color-text-secondary); margin-top:var(--space-2);" id="pantry-subtitle">Loading your grocery list...</p>
 </section>

 <!-- PANTRY -->
 <section>
 <div class="section-header">
 <h2 class="section-header__title">Your Pantry</h2>
 <a href="grocery-list.html" class="section-header__link">Update list →</a>
 </div>
 <div class="pantry-row" id="pantry-pills">
 <div class="skeleton" style="height:32px;width:90px;border-radius:999px;"></div>
 <div class="skeleton" style="height:32px;width:80px;border-radius:999px;"></div>
 <div class="skeleton" style="height:32px;width:70px;border-radius:999px;"></div>
 </div>
 </section>

 <!-- MEAL SLOTS -->
 <section>
 <div class="section-header">
 <h2 class="section-header__title">Today's Meals</h2>
 <span class="section-header__link" id="meals-cal-total" style="font-family:var(--font-mono);">0 kcal planned</span>
 </div>
 <div class="meal-plan-grid" id="meal-plan-grid"></div>
 </section>

 <!-- MACRO SUMMARY -->
 <section>
 <div class="macro-summary-card animate-fade-in-up">
 <div class="macro-summary-header">
 <p class="macro-summary__title">Macro Summary</p>
 <div class="macro-summary__cal"><span id="summary-cal-planned">0</span> / <span id="summary-cal-target">—</span> kcal</div>
 </div>
 <div class="macro-summary-bars" id="macro-summary-bars"></div>
 </div>
 </section>

 <!-- ALMOST READY -->
 <section id="almost-section">
 <div class="section-header">
 <h2 class="section-header__title">Almost Ready</h2>
 <span style="font-size:var(--text-xs); color:var(--color-text-muted);">Missing 1 item</span>
 </div>
 <div class="stack stack-sm" id="almost-list"></div>
 </section>

 <div style="height:var(--space-8);"></div>
 </main>

 <!-- ══ PICKER OVERLAY ═══════════════════════════════════ -->
 <div class="sheet-overlay" id="picker-overlay" role="dialog" aria-modal="true" aria-label="Choose a meal">
 <div class="sheet sheet--tall" id="picker-sheet">
 <div class="sheet-handle" aria-hidden="true"></div>
 <div>
 <div style="font-size:var(--text-xs); font-weight:var(--weight-bold); letter-spacing:var(--tracking-widest); text-transform:uppercase; color:var(--color-accent-text);" id="picker-slot-label">Breakfast</div>
 <div style="font-family:var(--font-display); font-size:var(--text-xl); color:var(--color-text-primary);">Choose a meal</div>
 </div>
 <div class="picker-tabs" role="tablist" id="picker-tabs">
 <button class="picker-tab is-active" data-filter="available" onclick="setPickerFilter('available')">Available</button>
 <button class="picker-tab" data-filter="almost" onclick="setPickerFilter('almost')">Almost</button>
 <button class="picker-tab" data-filter="all" onclick="setPickerFilter('all')">All</button>
 </div>
 <div class="picker-recipe-list" id="picker-recipe-list"></div>
 </div>
 </div>

 <!-- ══ RECIPE DETAIL OVERLAY ════════════════════════════ -->
 <div class="sheet-overlay" id="detail-overlay" role="dialog" aria-modal="true" aria-label="Recipe details">
 <div class="sheet sheet--tall" id="detail-sheet">
 <div style="display:flex; justify-content:space-between; align-items:center; flex-shrink:0;">
 <div class="sheet-handle" style="margin:0;" aria-hidden="true"></div>
 <button onclick="closeDetail()" style="background:none; border:none; font-size:var(--text-lg); cursor:pointer; color:var(--color-text-secondary); padding:var(--space-2);" aria-label="Back to recipe list">← Back</button>
 </div>

 <!-- Detail content injected by JS -->
 <div id="detail-content"></div>

 <!-- Sticky CTA -->
 <div class="detail-cta" id="detail-cta">
 <button class="btn btn--primary btn--lg btn--full" id="detail-select-btn" onclick="confirmDetailSelection()">
 Add to Meal
 </button>
 </div>
 </div>
 </div>

 <div id="bottom-nav-container"></div>
 </div>

 <script src="script-merged.js"></script>

 /* ── MEAL SLOT DEFINITIONS ───────────────────────────── */
 const MEAL_SLOTS = [
 { id: 'breakfast', label: 'Breakfast', time: '7–9 AM', pct: 0.25, compatibleSlots: ['breakfast'] },
 { id: 'lunch', label: 'Lunch', time: '12–1 PM', pct: 0.35, compatibleSlots: ['lunch'] },
 { id: 'dinner', label: 'Dinner', time: '6–7 PM', pct: 0.30, compatibleSlots: ['dinner', 'lunch'] },
 { id: 'snack', label: 'Snack', time: 'Anytime', pct: 0.10, compatibleSlots: ['snack'] },
 ];

 const STORAGE_MEAL_PLAN_KEY = 'fitforge_meal_plan';

 /* ── PAGE STATE ──────────────────────────────────────── */
 const nutritionState = {
 profile: null,
 checkedFoodKeys: [],
 checkedCategories: [],
 mealPlan: { breakfast: null, lunch: null, dinner: null, snack: null },
 activeSlotId: null,
 pickerFilter: 'available',
 detailRecipeId: null, // recipe currently shown in detail sheet
 };

 /* ── INIT ────────────────────────────────────────────── */
 document.addEventListener('DOMContentLoaded', () => {
 nutritionState.profile = AppState.getProfile();
 loadGroceryData();
 loadSavedMealPlan();
 renderPantry();
 renderMealSlots();
 renderMacroSummary();
 renderAlmostReady();
 renderHeaderBadge();

 // Close picker when tapping overlay background
 document.getElementById('picker-overlay')?.addEventListener('click', e => {
 if (e.target === e.currentTarget) closePicker();
 });
 // Close detail when tapping overlay background
 document.getElementById('detail-overlay')?.addEventListener('click', e => {
 if (e.target === e.currentTarget) closeDetail();
 });
 });

 /* ── GROCERY DATA ────────────────────────────────────── */
 function loadGroceryData() {
 try {
 const stored = localStorage.getItem('fitforge_grocery_list');
 if (!stored) { UIHelpers.setText('#pantry-subtitle', 'No grocery list found — add items to unlock recipes.'); return; }
 const items = JSON.parse(stored)?.items ?? [];
 const checkedItems = items.filter(i => i.checked && i.foodKey);
 nutritionState.checkedFoodKeys = [...new Set(checkedItems.map(i => i.foodKey))];
 nutritionState.checkedCategories = [...new Set(items.filter(i => i.checked).map(i => i.category))];
 const total = items.length;
 const checked = items.filter(i => i.checked).length;
 UIHelpers.setText('#pantry-subtitle', checked > 0 ? `${checked} of ${total} grocery items checked` : 'Check items on your grocery list to unlock recipes.');
 } catch (e) { UIHelpers.setText('#pantry-subtitle', 'Could not load grocery list.'); }
 }

 /* ── AVAILABILITY ────────────────────────────────────── */
 function getRecipeAvailability(recipe) {
 const required = recipe.requiredIngredients ?? [];
 if (!required.length) return { status: 'available', missing: [] };
 const missing = required.filter(k => !nutritionState.checkedFoodKeys.includes(k));
 if (!missing.length) return { status: 'available', missing: [] };
 if (missing.length === 1) return { status: 'almost', missing };
 return { status: 'locked', missing };
 }

 function foodKeyToName(key) {
 const map = { chicken:'Chicken', rice:'Rice', veggies:'Vegetables', turkey:'Turkey', salmon:'Salmon', tuna:'Tuna', shrimp:'Shrimp', beef:'Beef', tofu:'Tofu', eggs:'Eggs', greek_yogurt:'Greek Yogurt', cottage_cheese:'Cottage Cheese', oats:'Oats', potato:'Sweet Potato', avocado:'Avocado' };
 return map[key] ?? key;
 }

 function countAvailableForSlot(slotId) {
 const slot = MEAL_SLOTS.find(s => s.id === slotId);
 if (!slot) return 0;
 return RECIPE_CATALOG.filter(r => slot.compatibleSlots.some(cs => r.slots.includes(cs)) && getRecipeAvailability(r).status === 'available').length;
 }

 function countTotalAvailable() {
 return RECIPE_CATALOG.filter(r => getRecipeAvailability(r).status === 'available').length;
 }

 /* ── PERSISTENCE ─────────────────────────────────────── */
 function loadSavedMealPlan() {
 try {
 const raw = localStorage.getItem(STORAGE_MEAL_PLAN_KEY);
 if (!raw) return;
 const saved = JSON.parse(raw);
 if (saved.date !== UIHelpers.getTodayString()) return;
 MEAL_SLOTS.forEach(slot => {
 if (saved[slot.id]) {
 const recipe = RECIPE_CATALOG.find(r => r.id === saved[slot.id]);
 if (recipe) nutritionState.mealPlan[slot.id] = recipe;
 }
 });
 } catch {}
 }

 function saveMealPlan() {
 const data = { date: UIHelpers.getTodayString() };
 MEAL_SLOTS.forEach(s => { data[s.id] = nutritionState.mealPlan[s.id]?.id ?? null; });
 localStorage.setItem(STORAGE_MEAL_PLAN_KEY, JSON.stringify(data));
 }

 /* ── RENDER: HEADER BADGE ────────────────────────────── */
 function renderHeaderBadge() {
 const badge = document.getElementById('recipes-ready-badge');
 if (!badge) return;
 const count = countTotalAvailable();
 badge.textContent = `${count} ready`;
 badge.style.display = count > 0 ? 'block' : 'none';
 }

 /* ── RENDER: PANTRY ──────────────────────────────────── */
 function renderPantry() {
 const container = document.getElementById('pantry-pills');
 if (!container) return;
 const cats = [
 { key:'protein', label:'Proteins', icon:'' }, { key:'carbs', label:'Carbs', icon:'' },
 { key:'fat', label:'Fats', icon:'' }, { key:'produce', label:'Produce', icon:'' },
 ];
 container.innerHTML = cats.map(c => {
 const ok = nutritionState.checkedCategories.includes(c.key);
 return `<div class="pantry-pill pantry-pill--${ok?'available':'missing'}"><div class="pantry-pill__dot"></div><span>${c.icon} ${c.label}</span></div>`;
 }).join('');
 }

 /* ── RENDER: MEAL SLOTS ──────────────────────────────── */
 function renderMealSlots() {
 const grid = document.getElementById('meal-plan-grid');
 if (!grid) return;
 const targetCal = nutritionState.profile?.calculatedMacros?.targetCalories ?? 2000;
 grid.innerHTML = MEAL_SLOTS.map(slot => {
 const recipe = nutritionState.mealPlan[slot.id];
 const slotTarget = Math.round(targetCal * slot.pct);
 const available = countAvailableForSlot(slot.id);
 return `
 <div class="meal-slot-card ${recipe?'is-filled':''}" id="slot-card-${slot.id}">
 <div class="meal-slot-header">
 <div class="meal-slot-header__left">
 <span class="meal-slot-header__time">${slot.label}</span>
 <span style="color:var(--color-text-muted); font-size:var(--text-xs);">· ${slot.time}</span>
 </div>
 <span class="meal-slot-header__cal">~${slotTarget} kcal target</span>
 </div>
 ${recipe ? buildFilledSlot(slot, recipe) : buildEmptySlot(slot, available)}
 </div>`;
 }).join('');
 updateCalTotals();
 }

 function buildEmptySlot(slot, available) {
 return `
 <div class="meal-slot-empty" onclick="openPicker('${slot.id}')" role="button" tabindex="0">
 <span class="meal-slot-empty__text">Tap to choose a ${slot.label.toLowerCase()}</span>
 <span class="meal-slot-empty__badge ${available===0?'meal-slot-empty__badge--zero':''}">
 ${available > 0 ? `${available} available` : 'Check grocery list'}
 </span>
 </div>`;
 }

 function buildFilledSlot(slot, recipe) {
 return `
 <div class="meal-slot-filled" onclick="openPicker('${slot.id}')" role="button" tabindex="0">
 <div class="meal-slot-filled__info">
 <div class="meal-slot-filled__name">${recipe.emoji} ${UIHelpers.escapeHTML(recipe.name)}</div>
 <div class="meal-slot-filled__macros">
 <span class="meal-macro-chip">${recipe.proteinG}g P</span>
 <span class="meal-macro-chip">${recipe.carbsG}g C</span>
 <span class="meal-macro-chip">${recipe.fatG}g F</span>
 </div>
 </div>
 <div class="meal-slot-filled__actions">
 <div class="meal-slot-filled__cal">${recipe.calories}</div>
 <div class="meal-slot-filled__swap">Swap ⇄</div>
 </div>
 </div>`;
 }

 /* ── RENDER: MACRO SUMMARY ───────────────────────────── */
 function renderMacroSummary() {
 const macros = nutritionState.profile?.calculatedMacros;
 const targets = { proteinG: macros?.proteinG??180, carbsG: macros?.carbsG??200, fatG: macros?.fatG??55, calories: macros?.targetCalories??2000 };
 const planned = getTotalPlannedMacros();
 UIHelpers.setText('#summary-cal-planned', planned.calories);
 UIHelpers.setText('#summary-cal-target', targets.calories);
 const container = document.getElementById('macro-summary-bars');
 if (!container) return;
 const rows = [
 { label:'Protein', planned:planned.proteinG, target:targets.proteinG, color:'var(--color-protein)' },
 { label:'Carbs', planned:planned.carbsG, target:targets.carbsG, color:'var(--color-carbs)' },
 { label:'Fat', planned:planned.fatG, target:targets.fatG, color:'var(--color-fat)' },
 ];
 container.innerHTML = rows.map(r => {
 const pct = Math.min(100, Math.round(r.planned/r.target*100));
 return `
 <div class="macro-summary-row">
 <span class="macro-summary-row__label">${r.label}</span>
 <div style="flex:1;"><div class="progress-bar"><div class="progress-bar__fill" style="background:${r.color};width:${pct}%;"></div></div></div>
 <span class="macro-summary-row__values">${r.planned}g / ${r.target}g</span>
 </div>`;
 }).join('');
 }

 /* ── RENDER: ALMOST READY ────────────────────────────── */
 function renderAlmostReady() {
 const section = document.getElementById('almost-section');
 const list = document.getElementById('almost-list');
 if (!list) return;
 const almost = RECIPE_CATALOG.filter(r => getRecipeAvailability(r).status === 'almost');
 if (!almost.length) { section && (section.style.display='none'); return; }
 section && (section.style.display='');
 list.innerHTML = almost.slice(0, 4).map(recipe => {
 const { missing } = getRecipeAvailability(recipe);
 return `
 <div class="almost-card">
 <div class="almost-card__icon" style="display:none;"></div>
 <div class="almost-card__info">
 <div class="almost-card__name">${UIHelpers.escapeHTML(recipe.name)}</div>
 <div class="almost-card__missing">Missing: ${missing.map(foodKeyToName).join(', ')}</div>
 <div class="almost-card__macros">${recipe.calories} kcal · ${recipe.proteinG}P · ${recipe.carbsG}C · ${recipe.fatG}F</div>
 </div>
 <a href="grocery-list.html" class="almost-card__add">+ Add →</a>
 </div>`;
 }).join('');
 }

 /* ── TOTALS ──────────────────────────────────────────── */
 function getTotalPlannedMacros() {
 const t = { calories:0, proteinG:0, carbsG:0, fatG:0 };
 MEAL_SLOTS.forEach(s => { const r=nutritionState.mealPlan[s.id]; if(r){t.calories+=r.calories;t.proteinG+=r.proteinG;t.carbsG+=r.carbsG;t.fatG+=r.fatG;} });
 return t;
 }

 function updateCalTotals() {
 UIHelpers.setText('#meals-cal-total', `${getTotalPlannedMacros().calories.toLocaleString()} kcal planned`);
 }

 /* ════════════════════════════════════════════════════════
 PICKER MODAL
 ════════════════════════════════════════════════════════ */
 function openPicker(slotId) {
 nutritionState.activeSlotId = slotId;
 nutritionState.pickerFilter = 'available';
 const slot = MEAL_SLOTS.find(s => s.id === slotId);
 UIHelpers.setText('#picker-slot-label', slot?.label ?? slotId);
 setPickerFilter('available');
 document.getElementById('picker-overlay').classList.add('is-open');
 }

 function closePicker() {
 document.getElementById('picker-overlay').classList.remove('is-open');
 nutritionState.activeSlotId = null;
 }

 function setPickerFilter(filter) {
 nutritionState.pickerFilter = filter;
 document.querySelectorAll('.picker-tab').forEach(btn => {
 btn.classList.toggle('is-active', btn.dataset.filter === filter);
 });
 renderPickerRecipes();
 }

 function renderPickerRecipes() {
 const list = document.getElementById('picker-recipe-list');
 const slotId = nutritionState.activeSlotId;
 if (!list || !slotId) return;
 const slot = MEAL_SLOTS.find(s => s.id === slotId);
 if (!slot) return;

 let recipes = RECIPE_CATALOG.filter(r => slot.compatibleSlots.some(cs => r.slots.includes(cs)));

 const filter = nutritionState.pickerFilter;
 recipes = recipes.filter(r => {
 const { status } = getRecipeAvailability(r);
 if (filter === 'available') return status === 'available';
 if (filter === 'almost') return status === 'almost';
 return true;
 });

 if (!recipes.length) {
 list.innerHTML = `
 <div class="picker-empty">
 <div class="picker-empty__icon">${filter==='available'?'':''}</div>
 <div class="picker-empty__text">
 ${filter==='available'
 ? `No recipes ready for ${slot.label} yet.<br><span class="picker-empty__link" onclick="window.location.href='grocery-list.html'">Check items on your grocery list →</span>`
 : `No ${filter==='almost'?'"almost ready"':''} recipes for ${slot.label}.`}
 </div>
 </div>`;
 return;
 }

 const currentRecipe = nutritionState.mealPlan[slotId];
 list.innerHTML = recipes.map(recipe => {
 const { status, missing } = getRecipeAvailability(recipe);
 const isSelected = currentRecipe?.id === recipe.id;
 return `
 <div class="picker-recipe-card ${isSelected?'is-selected':''} ${status==='almost'?'is-almost':''}"
 role="button" tabindex="0">

 <!-- Tap thumb → open detail -->
 <div class="picker-recipe-card__thumb picker-recipe-card__thumb--${recipe.thumbType}"
 onclick="openDetail('${recipe.id}')"
 title="View ingredients & instructions"
 style="cursor:pointer;">
 ${recipe.emoji}
 </div>

 <!-- Tap body → select recipe -->
 <div class="picker-recipe-card__body" onclick="selectRecipe('${recipe.id}')">
 <div style="display:flex; align-items:center; gap:6px; margin-bottom:4px;">
 <span class="picker-recipe-card__name">${UIHelpers.escapeHTML(recipe.name)}</span>
 ${status==='available' ? `<span class="avail-badge avail-badge--ready"> Ready</span>` : status==='almost' ? `<span class="avail-badge avail-badge--almost">Almost</span>` : ''}
 </div>
 <div class="picker-recipe-card__macros">
 <span class="meal-macro-chip">${recipe.proteinG}g P</span>
 <span class="meal-macro-chip">${recipe.carbsG}g C</span>
 <span class="meal-macro-chip">${recipe.fatG}g F</span>
 </div>
 ${missing.length ? `<div class="picker-recipe-card__missing">Missing: ${missing.map(foodKeyToName).join(', ')}</div>` : ''}
 </div>

 <!-- Right: cal + info button -->
 <div class="picker-recipe-card__right">
 <div class="picker-recipe-card__cal" onclick="selectRecipe('${recipe.id}')">${recipe.calories}<small>kcal</small></div>
 <button class="info-btn" onclick="openDetail('${recipe.id}')" aria-label="View ingredients and instructions for ${UIHelpers.escapeHTML(recipe.name)}">ℹ</button>
 </div>
 </div>`;
 }).join('');
 }

 /* Tap card body → select immediately */
 function selectRecipe(recipeId) {
 const slotId = nutritionState.activeSlotId;
 if (!slotId) return;
 const recipe = RECIPE_CATALOG.find(r => r.id === recipeId);
 if (!recipe) return;
 nutritionState.mealPlan[slotId] = recipe;
 saveMealPlan();
 closePicker();
 renderMealSlots();
 renderMacroSummary();
 renderAlmostReady();
 UIHelpers.showToast(`${recipe.name} added to ${MEAL_SLOTS.find(s=>s.id===slotId)?.label}`, 'success');
 }

 /* ════════════════════════════════════════════════════════
 RECIPE DETAIL SHEET
 Opens over the picker. User can read ingredients +
 instructions, then tap "Add to Meal" to select.
 ════════════════════════════════════════════════════════ */
 function openDetail(recipeId) {
 const recipe = RECIPE_CATALOG.find(r => r.id === recipeId);
 if (!recipe) return;

 nutritionState.detailRecipeId = recipeId;

 const { status, missing } = getRecipeAvailability(recipe);
 const slotId = nutritionState.activeSlotId;
 const slotLabel = MEAL_SLOTS.find(s => s.id === slotId)?.label ?? 'Meal';

 // Update the CTA button label
 const ctaBtn = document.getElementById('detail-select-btn');
 if (ctaBtn) {
 ctaBtn.textContent = `Add to ${slotLabel}`;
 ctaBtn.disabled = false;
 }

 // Build the ingredient rows with a / availability indicator
 const ingredientRows = recipe.ingredients.map(ing => {
 // Best-effort check: see if the ingredient name matches any checked foodKey
 const lowerName = ing.name.toLowerCase();
 const isAvail = nutritionState.checkedFoodKeys.some(key =>
 lowerName.includes(key.replace('_', ' ')) ||
 lowerName.includes(key)
 );
 return `
 <div class="ingredient-row">
 <div>
 <div class="ingredient-row__name">${UIHelpers.escapeHTML(ing.name)}</div>
 </div>
 <div style="display:flex; align-items:center; gap:var(--space-3);">
 <span class="ingredient-row__amount">${UIHelpers.escapeHTML(ing.amount)}</span>
 <span class="ingredient-row__status" title="${isAvail ? 'In your grocery list' : 'Not in your grocery list'}">${isAvail ? '' : '◻'}</span>
 </div>
 </div>`;
 }).join('');

 // Build the step list
 const stepsList = recipe.steps.map((step, i) => `
 <div class="instruction-step">
 <div class="instruction-step__num">${i + 1}</div>
 <div class="instruction-step__text">${UIHelpers.escapeHTML(step)}</div>
 </div>`).join('');

 // Build the missing ingredients warning (if any)
 const missingHTML = missing.length
 ? `<div style="background:rgba(194,112,10,0.08); border:1px solid rgba(194,112,10,0.25); border-radius:var(--radius-md); padding:var(--space-3) var(--space-4); font-size:var(--text-xs); color:var(--color-warning);">
 ⚠ Missing from grocery list: ${missing.map(foodKeyToName).join(', ')}
 — <a href="grocery-list.html" style="color:var(--color-warning); font-weight:700;">Add to list →</a>
 </div>`
 : '';

 document.getElementById('detail-content').innerHTML = `
 <!-- Hero -->
 <div class="detail-hero">
 <div class="detail-hero__thumb picker-recipe-card__thumb--${recipe.thumbType}">${recipe.emoji}</div>
 <div class="detail-hero__info">
 <div class="detail-hero__name">${UIHelpers.escapeHTML(recipe.name)}</div>
 <div class="detail-hero__meta">
 <span>⏱ ${recipe.prepMin} min</span>
 <span> 1 serving</span>
 </div>
 </div>
 </div>

 <!-- Macro pills -->
 <div class="detail-macro-row">
 <div class="detail-macro-pill">
 <div class="detail-macro-pill__value" style="color:var(--color-accent-text);">${recipe.calories}</div>
 <div class="detail-macro-pill__label">kcal</div>
 </div>
 <div class="detail-macro-pill">
 <div class="detail-macro-pill__value">${recipe.proteinG}g</div>
 <div class="detail-macro-pill__label">Protein</div>
 </div>
 <div class="detail-macro-pill">
 <div class="detail-macro-pill__value">${recipe.carbsG}g</div>
 <div class="detail-macro-pill__label">Carbs</div>
 </div>
 <div class="detail-macro-pill">
 <div class="detail-macro-pill__value">${recipe.fatG}g</div>
 <div class="detail-macro-pill__label">Fat</div>
 </div>
 </div>

 ${missingHTML}

 <!-- Ingredients -->
 <div>
 <div class="detail-section-label">Ingredients</div>
 <div class="ingredient-list">${ingredientRows}</div>
 </div>

 <!-- Instructions -->
 <div>
 <div class="detail-section-label">Instructions</div>
 <div class="instructions-list">${stepsList}</div>
 </div>
 `;

 // Show the detail overlay ON TOP of the picker overlay
 document.getElementById('detail-overlay').classList.add('is-open');
 }

 function closeDetail() {
 document.getElementById('detail-overlay').classList.remove('is-open');
 nutritionState.detailRecipeId = null;
 }

 /** Called when user taps "Add to Meal" from the detail sheet */
 function confirmDetailSelection() {
 const recipeId = nutritionState.detailRecipeId;
 if (!recipeId) return;
 closeDetail();
 selectRecipe(recipeId); // this also closes the picker
 }
 </script>
</body>
</html>
